name: document_reader_sdk
description: Identixia Document Reader SDK for Flutter — on-device ID / passport / DL recognition.
version: 0.1.0
homepage: https://identixia.com
repository: https://github.com/identixia-IDV/ID-Document-Recognition-Liveness-Detection-Flutter


environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.44.0"


dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8
  camera: ^0.12.0+2
  image: ^4.3.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0


flutter:
  plugin:
    platforms:
      android:
        package: com.identixia.document_reader_sdk
        pluginClass: DocumentRecognitionSdkPlugin
      ios:
        pluginClass: DocumentRecognitionSdkPlugin
